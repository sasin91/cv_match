name: app

# The desktop app in app/. Its parity tests compare it with the PHP modules' own answers
# (tests/fixtures/parity.json); the php job checks those fixtures are still what the PHP code on
# sasin91/recruiter's master answers, so a change on either side shows up here.
on:
  push:
    branches: [main]
    paths: ['app/**', 'assets/**', 'extension/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', 'assets/**', 'extension/**', '.github/workflows/app.yml']
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  php:
    name: fixtures match the PHP code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sasin91/recruiter
          path: recruiter
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring
      - run: php app/tests/fixtures/generate.php recruiter
      - run: git diff --exit-code -- app/tests/fixtures/parity.json

  import:
    name: import from MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: recruiter_test
          MARIADB_USER: test
          MARIADB_PASSWORD: test
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      RECRUITER_TEST_MYSQL: mysql://test:test@127.0.0.1:3306/recruiter_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sasin91/recruiter
          path: recruiter
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: mysql -h127.0.0.1 -utest -ptest recruiter_test < recruiter/db/schema.sql
      # One test at a time: each seeds the same database.
      - run: cargo test --test import -- --ignored --test-threads=1
        working-directory: app
