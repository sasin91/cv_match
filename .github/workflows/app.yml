name: app

# The desktop app in app/, with laya-server/'s model built in. Its parity tests compare it with
# the fixed expected answers in tests/fixtures/parity.json.
on:
  push:
    branches: [main]
    paths: ['app/**', 'assets/**', 'extension/**', 'laya-server/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', 'assets/**', 'extension/**', 'laya-server/**', '.github/workflows/app.yml']
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    env:
      # The query! macros check against the committed .sqlx, never a database.
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release

  sqlx:
    name: .sqlx matches the queries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # A database made from migrations/, which the query! macros are checked against.
      DATABASE_URL: sqlite:target/sqlx-dev.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      # sqlx-cli at the sqlx version Cargo.lock has, so it checks .sqlx the way the macros read it;
      # rust-cache keeps it between runs.
      - name: Install sqlx-cli at Cargo.lock's sqlx version
        run: |
          version=$(awk '/^name = "sqlx"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
          cargo install "sqlx-cli@$version" --locked --no-default-features --features sqlite
      - run: mkdir -p target && sqlx database reset -y
      - run: cargo sqlx prepare --check -- --all-targets
