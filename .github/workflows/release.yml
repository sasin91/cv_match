name: release

# The programs for a release: pushing a tag like v0.2.0 builds the app and attaches it to that
# tag's GitHub release.
#
# - Windows: jobfinder.exe, which runs from wherever it is kept (nothing to install).
# - Linux: JobFinder-x86_64.AppImage, which runs from wherever it is kept (nothing to install).
#   Built on the oldest Ubuntu runner, so it runs on distributions with an older glibc too.
#
# Run by hand, it builds the same files as workflow artifacts instead.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows program
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo build --release
      - name: Put the program in dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/jobfinder.exe dist/jobfinder.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/dist/jobfinder.exe
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: jobfinder-windows
          path: app/dist/

  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo build --release
      - name: Make the AppImage
        # appimagetool is itself an AppImage; the runner has no FUSE, so it unpacks itself to run.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
        run: |
          mkdir -p AppDir/usr/bin dist
          cp target/release/jobfinder AppDir/usr/bin/jobfinder
          ln -s usr/bin/jobfinder AppDir/AppRun
          cp ../extension/jobnet-joblog/icons/icon-128.png AppDir/jobfinder.png
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=JobFinder' \
            'Comment=Match your CV with job posts' 'Exec=jobfinder' 'Icon=jobfinder' \
            'Terminal=true' 'Categories=Office;' > AppDir/jobfinder.desktop
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool AppDir dist/JobFinder-x86_64.AppImage
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/dist/JobFinder-x86_64.AppImage
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: jobfinder-linux
          path: app/dist/
