name: release

# The programs for a release: pushing a tag like v0.2.0 builds the app and attaches it to that
# tag's GitHub release.
#
# - Windows: jobfinder.exe, which runs from wherever it is kept (nothing to install). The C runtime
#   is linked in (crt-static), so it starts on a Windows without the Visual C++ Redistributable.
# - Linux: JobFinder-x86_64.AppImage, which runs from wherever it is kept (nothing to install).
#   Built on Ubuntu 24.04: the ONNX Runtime linked in for Laya needs glibc 2.38 or newer, so it
#   runs on Ubuntu 24.04, Debian 13, Fedora 39 and later.
#
# The two build jobs only build; one publish job then makes the release with both files and their
# SHA256SUMS, so two jobs never race to make the same release.
#
# Run by hand, it builds the same files as workflow artifacts and publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows program
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    env:
      SQLX_OFFLINE: true
      # The C runtime built into the exe: a Windows without the Visual C++ Redistributable has no
      # VCRUNTIME140.dll to load it from.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: crt-static
      - run: cargo build --release
      - name: Check that the exe needs no Visual C++ runtime
        shell: pwsh
        run: |
          $sysroot = rustc --print sysroot
          $objdump = Get-ChildItem -Recurse -Filter llvm-objdump.exe "$sysroot/lib/rustlib" | Select-Object -First 1
          $imports = & $objdump.FullName -p target/release/jobfinder.exe | Select-String 'DLL Name'
          $imports | ForEach-Object { $_.Line.Trim() }
          $runtime = $imports | Where-Object { $_.Line -match 'VCRUNTIME|MSVCP|api-ms-win-crt' }
          if ($runtime) { throw "jobfinder.exe still loads the C runtime from a DLL: $($runtime.Line)" }
      - name: Put the program in dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/jobfinder.exe dist/jobfinder.exe
      - uses: actions/upload-artifact@v4
        with:
          name: jobfinder-windows
          path: app/dist/
          if-no-files-found: error

  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo build --release
      - name: Make the AppImage
        # appimagetool is itself an AppImage; the runner has no FUSE, so it unpacks itself to run.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
        run: |
          mkdir -p AppDir/usr/bin dist
          cp target/release/jobfinder AppDir/usr/bin/jobfinder
          ln -s usr/bin/jobfinder AppDir/AppRun
          cp ../extension/jobnet-joblog/icons/icon-128.png AppDir/jobfinder.png
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=JobFinder' \
            'Comment=Match your CV with job posts' 'Exec=jobfinder' 'Icon=jobfinder' \
            'Terminal=true' 'Categories=Office;' > AppDir/jobfinder.desktop
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool AppDir dist/JobFinder-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: jobfinder-linux
          path: app/dist/
          if-no-files-found: error

  publish:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum jobfinder.exe JobFinder-x86_64.AppImage > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/release-notes.md
          files: |
            dist/jobfinder.exe
            dist/JobFinder-x86_64.AppImage
            dist/SHA256SUMS
