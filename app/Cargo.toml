[package]
name = "recruiter"
version = "0.1.0"
edition = "2024"
description = "Recruiter's cv_match as a local desktop app: the matching core ported from the PHP modules"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Word lists keep the order PHP's arrays keep, which decides ties and typo candidates.
indexmap = { version = "2", features = ["serde"] }
regex = "1"
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
