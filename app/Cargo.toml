[package]
name = "recruiter"
version = "0.1.0"
edition = "2024"
description = "Recruiter's cv_match as a local desktop app"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Word lists keep the order PHP's arrays keep, which decides ties and typo candidates.
indexmap = { version = "2", features = ["serde"] }
regex = "1"
unicode-normalization = "0.1"
# SQLite built in, so the exe needs no sqlite3.dll.
rusqlite = { version = "0.41", features = ["bundled"] }
# Only for importing from the PHP app's MariaDB; the pure-Rust zlib keeps the build C-free.
mysql = { version = "28", default-features = false, features = ["minimal-rust"] }
dirs = "6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
