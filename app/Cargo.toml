[package]
name = "recruiter"
version = "0.1.0"
edition = "2024"
description = "Recruiter's cv_match as a local desktop app"
publish = false

# xtask/ holds the developer commands (`cargo dev`). It shares this Cargo.lock and target/, and
# plain `cargo build`, `cargo test` and `cargo run` still mean the app.
[workspace]
members = ["xtask"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Word lists keep the index's order, which decides ties and typo candidates.
indexmap = { version = "2", features = ["serde"] }
regex = "1"
unicode-normalization = "0.1"
# The app's SQLite (built in, so the exe needs no sqlite3.dll), with queries checked at compile
# time against the .sqlx cache.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite-bundled",
    "macros",
] }
dirs = "6"
# Lookaround in some patterns (Apply_instructions), which the regex crate lacks.
fancy-regex = "0.20"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "process", "time"] }
askama = "0.16"
# The page's CSS and JS, read from ../assets while developing and built into the exe for release.
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
chrono = "0.4"
webbrowser = "1"
pdf-writer = "0.15"
subsetter = "0.2"
ttf-parser = "0.25"
miniz_oxide = "0.9"
# The user's API key, in Windows Credential Manager.
keyring = "4"
# The language models' APIs over HTTPS (rustls, with Windows' own certificate store), through
# the system's proxy when one is set; job post pages (Page_reader), compressed as servers send them.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "system-proxy", "gzip", "brotli", "deflate"] }
# Job posts fetched from a pasted link (Page_reader): the page's HTML as a tree, its entities
# and the encodings older sites still send.
scraper = "0.29"
ego-tree = "0.11"
url = "2"
html-escape = "0.3"
encoding_rs = "0.8"
# Laya on ONNX Runtime, run in this process (ONNX Runtime linked in statically).
laya-server = { path = "../laya-server" }

# The memory and graphics card a llama.cpp model is weighed against (DXGI), and the job object
# that ends llama-server with the app.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
sha2 = "0.10"
base64 = "0.22"
